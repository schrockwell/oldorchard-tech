  <meta name="description" content="Macintosh and vintage computer repair services">
  <meta name="theme-color" content="#427F2D">
  <meta name="color-scheme" content="light only">
  <link rel="canonical" href="https://oldorchard.tech">

  <meta property="og:site_name" content="Old Orchard Tech">
  <meta property="og:title" content="Old Orchard Tech">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Macintosh and vintage computer repair services">
  <meta property="og:url" content="https://oldorchard.tech">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;700&family=Inter:wght@400&display=swap">

  <style>
    :root {
      --green: #417F2D;
      --green-dark: #214017;
      --card-bg: #FFFFFF;
      --text: #000000;
      --font-heading: 'Chivo', system-ui, sans-serif;
      --font-body: 'Chivo', system-ui, sans-serif;
      --font-button: 'Inter', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background-color: var(--green);
      background-image:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0) 60%);
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 35rem;
      background: var(--card-bg);
      padding: clamp(1.75rem, 5vw, 3rem);
      box-shadow: 0 1em 3em rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .logo {
      display: block;
      width: 7.5rem;
      height: 7.5rem;
      margin: 0 auto 1.25rem;
    }

    h1 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: clamp(2rem, 6vw, 2.875rem);
      line-height: 1.25;
      letter-spacing: -0.025rem;
      margin: 0 0 0.5rem;
    }

    h2 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 1.375;
      letter-spacing: -0.025rem;
      margin: 0 0 1rem;
    }

    p {
      margin: 0 0 1.25rem;
    }

    a {
      color: var(--green);
      text-decoration: underline;
    }

    a:hover,
    a:focus-visible {
      color: var(--green-dark);
    }

    .byline {
      margin-bottom: 1.25rem;
    }

    .services {
      list-style: none;
      margin: 0 0 1.5rem;
      padding: 0;
    }

    .services li {
      margin: 0.1rem 0;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      height: 3.125rem;
      padding: 0 1.5625rem;
      font-family: var(--font-button);
      font-weight: 400;
      font-size: 1rem;
      color: var(--text);
      text-decoration: none;
      background: var(--card-bg);
      border: 2px solid var(--text);
      border-radius: 0;
      box-shadow: 0.177rem 0.177rem 0 0 var(--text);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .button:hover,
    .button:focus-visible {
      color: var(--text);
      transform: translate(-1px, -1px);
      box-shadow: calc(0.177rem + 1px) calc(0.177rem + 1px) 0 0 var(--text);
    }

    .button:active {
      transform: translate(0.177rem, 0.177rem);
      box-shadow: none;
    }

    .button svg {
      width: 1.25rem;
      height: 1.25rem;
      fill: currentColor;
      flex: none;
    }

    hr {
      border: 0;
      border-top: 1px solid rgba(144, 144, 144, 0.25);
      margin: 2rem 0;
    }

    .gallery {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .gallery li {
      margin: 0;
    }

    .gallery figure {
      margin: 0;
    }

    .gallery a {
      display: block;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #eee;
    }

    .gallery figcaption {
      font-size: 0.85rem;
      line-height: 1.4;
      margin-top: 0.4rem;
      text-align: left;
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      margin: 2rem 0 0;
      padding: 0;
      list-style: none;
    }

    .social a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      color: var(--text);
    }

    .social svg {
      width: 1.75rem;
      height: 1.75rem;
      fill: currentColor;
    }

    .social a:hover,
    .social a:focus-visible {
      color: var(--green);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: 1fr;
      }

      .social {
        gap: 0.75rem;
      }
    }
  </style>
</head>
